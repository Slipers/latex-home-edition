# Construit l'installateur Windows de LaTeX MolecularChemistry Edition et le publie
# dans la release de tag fixe « molecular-latest », sur laquelle pointent les mises à
# jour automatiques de l'application. LaTeX Home Edition n'est pas concerné : il publie
# ses propres binaires sur ses propres tags.
name: MolecularChemistry — installateur Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (laisser vide pour reprendre celle de package.json)"
        required: false
        type: string
  push:
    # Un tag molecular-v* publie la version correspondante.
    tags:
      - "molecular-v*"
    # Les branches de travail claude/** construisent aussi l'installateur, ce qui permet
    # de le produire sans attendre une fusion dans main. Aucun envoi sur main ne déclenche
    # la publication : elle reste un geste volontaire (tag ou « Run workflow »).
    branches:
      - "claude/**"
    paths:
      - "molecular/**"
      - ".github/workflows/molecular-release.yml"

permissions:
  contents: write      # publier la release ; aucun autre droit n'est accordé

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: molecular

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # La valeur passe par une variable d'environnement, jamais par une interpolation
      # ${{ }} dans le corps du script : sans cela une saisie du type 1.0.0"; curl …
      # serait exécutée par le shell du runner (injection de commande).
      - name: Fixer la version demandée
        if: inputs.version != ''
        shell: bash
        env:
          VERSION_DEMANDEE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION_DEMANDEE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version invalide : seules les formes X.Y.Z sont acceptées." >&2
            exit 1
          fi
          npm version "$VERSION_DEMANDEE" --no-git-tag-version --allow-same-version

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Synchroniser js/version.js
        run: node scripts/sync-version.js

      - name: Construire l'installateur
        run: npx electron-builder --win --publish never

      - name: Relever la version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publier dans la release molecular-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          TAG=molecular-latest
          TITRE="LaTeX MolecularChemistry Edition $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITRE" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" --title "$TITRE" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$TAG" \
            dist/*.exe dist/molecular.yml dist/*.blockmap --clobber

      - name: Conserver l'installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: MolecularChemistry-Edition-Setup
          path: molecular/dist/*.exe
          if-no-files-found: error
