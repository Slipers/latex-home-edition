# Publie le site web https://slipers.github.io/latex-home-edition/ (GitHub Pages) :
# la version web de l'éditeur à la racine, et les pages de docs/ (liens de partage p/,
# invitations d/, compte/). Le site est assemblé par scripts/build-web.mjs.
# Réglage du dépôt : Settings → Pages → Source « GitHub Actions ».
name: Site web — éditeur en ligne et pages de partage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - vendor/**
      - docs/**
      - scripts/build-web.mjs
      - .github/workflows/site.yml

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; la plus récente l'emporte
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    name: Publier le site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assembler le site
        run: node scripts/build-web.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v5
