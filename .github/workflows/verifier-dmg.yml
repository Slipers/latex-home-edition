# Vérifie, sur un vrai macOS, les .dmg publiés dans une release : intégrité de
# l'image, montage, contenu du paquet, architecture et association des .lhe.
# Lancement : onglet Actions → « Vérifier les .dmg publiés » → Run workflow.
name: Vérifier les .dmg publiés

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à vérifier (par défaut : celle de package.json)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verifier:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les images disque
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="$(node -p "require('./package.json').version")"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          gh release download "v$V" --pattern "*.dmg" --dir images
          ls -lh images
      - name: Contrôler chaque image
        run: |
          set -e
          for ARCH in arm64 x64; do
            DMG="images/LaTeX-Home-Edition-$VERSION-$ARCH.dmg"
            echo "::group::$DMG"
            hdiutil verify "$DMG"
            PT=$(mktemp -d)
            hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$PT"
            APP="$PT/LaTeX Home Edition.app"
            test -d "$APP" || { echo "Paquet introuvable"; exit 1; }
            test -L "$PT/Applications" || echo "Attention : pas de raccourci vers Applications"
            BIN="$APP/Contents/MacOS/LaTeX Home Edition"
            test -x "$BIN" || { echo "Exécutable manquant"; exit 1; }
            file "$BIN"
            case "$ARCH" in
              arm64) file "$BIN" | grep -q "arm64" || { echo "Mauvaise architecture"; exit 1; };;
              x64)   file "$BIN" | grep -q "x86_64" || { echo "Mauvaise architecture"; exit 1; };;
            esac
            PL="$APP/Contents/Info.plist"
            for CLE in CFBundleIdentifier CFBundleShortVersionString LSMinimumSystemVersion; do
              echo "$CLE = $(/usr/libexec/PlistBuddy -c "Print :$CLE" "$PL")"
            done
            /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions" "$PL" | tr -d ' \n' | grep -q "lhe" \
              && echo "Association des fichiers .lhe : présente" || { echo "Association .lhe absente"; exit 1; }
            test -f "$APP/Contents/Resources/app.asar" || { echo "app.asar manquant"; exit 1; }
            du -sh "$APP"
            codesign -dv "$APP" 2>&1 | head -3 || true
            hdiutil detach "$PT" -quiet
            echo "::endgroup::"
            echo "✓ $ARCH : image valide, paquet complet"
          done
