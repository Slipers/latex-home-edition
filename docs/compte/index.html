<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Compte — LaTeX Home Edition</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --txt: #1f2430; --mut: #6b7385; --line: #e1e4ea; --line2: #cfd4dc;
    --acc: #2b4c7e; --acc2: #3f6bb0; --ok: #237a44; --ok-bg: #effaf2; --err: #a33; --err-bg: #fdf0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15181e; --card: #1f232b; --txt: #e7e9ee; --mut: #9aa2b3; --line: #2f3440; --line2: #3a4050;
      --acc: #8fb2ea; --acc2: #a9c4f0; --ok: #8fd6a7; --ok-bg: #1d3326; --err: #f0a3a3; --err-bg: #3a2326; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--txt); background: var(--bg); }
  main { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px; box-shadow: 0 10px 30px rgba(20,30,50,.08); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--mut); font-size: 13px; margin-bottom: 18px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; background: #2b4c7e; color: #fff; display: grid; place-items: center; font: 18px Cambria, serif; }
  h1 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; }
  p { margin: 0 0 14px; }
  .mut { color: var(--mut); font-size: 13px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 9px; font: inherit; background: var(--card); color: var(--txt); }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 16px; padding: 12px 16px; border-radius: 10px; border: 1px solid #2b4c7e; background: #2b4c7e; color: #fff; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn.sec { background: transparent; color: var(--acc); border-color: var(--line2); }
  .btn:disabled { opacity: .6; cursor: default; }
  .ok { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 12px 14px; }
  .err { background: var(--err-bg); color: var(--err); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  a { color: var(--acc); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="logo">∑</span><span>LaTeX Home Edition — compte</span></div>
  <div id="view"><p class="mut">Chargement…</p></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://temejdqaocdqqoodqjyk.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_MCpfjyXJgTyh64p80I5hiA_xAq30XtY';
  const HERE = 'https://slipers.github.io/latex-home-edition/compte/';
  const APP = 'https://github.com/Slipers/latex-home-edition/releases/latest';
  const view = document.getElementById('view');
  const h = (html) => { view.innerHTML = html; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const params = new URLSearchParams(location.hash.replace(/^#/, '') || location.search.replace(/^\?/, ''));
  const back = '<a class="btn" href="lhe://ouvrir">Ouvrir LaTeX Home Edition</a><a class="btn sec" href="' + APP + '">Télécharger l\'application</a>';
  let sb = null;
  try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, detectSessionInUrl: true, flowType: 'implicit' } }); } catch (e) { /* hors ligne */ }

  function frErr(m) {
    m = String(m || '');
    if (/expired|invalid/i.test(m)) return 'Ce lien a expiré ou a déjà été utilisé. Redemandez-en un depuis l\'application (« Renvoyer l\'e-mail » ou « Mot de passe oublié »).';
    if (/Password should be|weak/i.test(m)) return 'Mot de passe trop faible : au moins 8 caractères, avec des lettres et des chiffres.';
    if (/already registered/i.test(m)) return 'Un compte existe déjà avec cette adresse : connectez-vous dans l\'application.';
    if (/rate limit|security purposes/i.test(m)) return 'Trop de tentatives : patientez une minute.';
    return m || 'Erreur inattendue.';
  }

  function signupForm() {
    h('<h1>Créer un compte</h1><p class="mut">Pour modifier des documents à plusieurs en direct (Live Modification) et recevoir des invitations.</p>'
      + '<label for="nk">Pseudo</label><input id="nk" maxlength="40" placeholder="Affiché à côté de votre curseur">'
      + '<label for="em">Adresse e-mail</label><input id="em" type="email" autocomplete="email" placeholder="vous@exemple.fr">'
      + '<label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="new-password" placeholder="Au moins 8 caractères, lettres et chiffres">'
      + '<label for="pw2">Confirmer</label><input id="pw2" type="password" autocomplete="new-password">'
      + '<div id="e" class="err" hidden></div><button class="btn" id="go">Créer mon compte</button>'
      + '<p class="mut" style="margin-top:14px">Un e-mail de confirmation vous sera envoyé : le compte n\'est actif qu\'après un clic sur son lien. Seuls votre adresse et votre pseudo sont conservés.</p>'
      + '<p class="mut">Déjà un compte ? Connectez-vous dans l\'application. <a href="' + APP + '">Télécharger l\'application</a></p>');
    const $ = id => document.getElementById(id), err = $('e');
    $('go').onclick = async () => {
      err.hidden = true;
      const nk = $('nk').value.trim(), em = $('em').value.trim().toLowerCase(), pw = $('pw').value;
      const fail = m => { err.hidden = false; err.textContent = m; };
      if (!nk) return fail('Choisissez un pseudo.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return fail('Cette adresse e-mail n\'est pas valide.');
      if (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) return fail('Mot de passe trop faible : au moins 8 caractères, avec des lettres et des chiffres.');
      if (pw !== $('pw2').value) return fail('Les deux mots de passe ne correspondent pas.');
      $('go').disabled = true;
      const r = await sb.auth.signUp({ email: em, password: pw, options: { data: { pseudo: nk }, emailRedirectTo: HERE } });
      if (r.error) { $('go').disabled = false; return fail(frErr(r.error.message)); }
      h('<h1>Vérifiez votre boîte mail</h1><div class="ok">Un lien de confirmation vient d\'être envoyé à <b>' + esc(em) + '</b> (s\'il n\'y avait pas déjà un compte avec cette adresse). Cliquez dessus pour activer votre compte — pensez aux courriers indésirables.</div>');
    };
  }

  function recoveryForm() {
    h('<h1>Nouveau mot de passe</h1><label for="pw">Nouveau mot de passe</label><input id="pw" type="password" autocomplete="new-password" placeholder="Au moins 8 caractères, lettres et chiffres">'
      + '<label for="pw2">Confirmer</label><input id="pw2" type="password" autocomplete="new-password"><div id="e" class="err" hidden></div><button class="btn" id="go">Enregistrer</button>');
    const $ = id => document.getElementById(id), err = $('e');
    $('go').onclick = async () => {
      err.hidden = true;
      const pw = $('pw').value, fail = m => { err.hidden = false; err.textContent = m; };
      if (pw.length < 8 || !/[a-zA-Z]/.test(pw) || !/\d/.test(pw)) return fail('Au moins 8 caractères, avec des lettres et des chiffres.');
      if (pw !== $('pw2').value) return fail('Les deux mots de passe ne correspondent pas.');
      $('go').disabled = true;
      const r = await sb.auth.updateUser({ password: pw });
      if (r.error) { $('go').disabled = false; return fail(frErr(r.error.message)); }
      await sb.auth.signOut();
      h('<h1>Mot de passe changé</h1><div class="ok">Votre nouveau mot de passe est enregistré. Connectez-vous avec dans l\'application.</div>' + back);
    };
  }

  (async () => {
    const type = params.get('type'), error = params.get('error_description') || params.get('error');
    // Le client lit le jeton dans l'adresse à son démarrage : on attend, puis on l'efface de l'adresse
    if (sb) { try { await sb.auth.getSession(); } catch (e) { /* ignoré */ } }
    history.replaceState(null, '', location.pathname);
    if (error) { h('<h1>Lien invalide</h1><div class="err">' + esc(frErr(error)) + '</div>' + back); return; }
    if (!sb) { h('<h1>Connexion impossible</h1><div class="err">Le service de comptes ne répond pas. Vérifiez votre connexion internet puis rechargez la page.</div>'); return; }
    if (type === 'recovery') {
      const { data } = await sb.auth.getSession();
      if (!data.session) { h('<h1>Lien invalide</h1><div class="err">' + esc(frErr('expired')) + '</div>' + back); return; }
      recoveryForm();
      return;
    }
    if (type === 'signup' || type === 'email_change' || type === 'invite' || params.get('access_token')) {
      await sb.auth.signOut().catch(() => {});
      h('<h1>Adresse confirmée ✓</h1><div class="ok">Votre compte est actif. Revenez dans LaTeX Home Edition et connectez-vous avec votre adresse e-mail et votre mot de passe.</div>' + back);
      return;
    }
    signupForm();
  })();
</script>
</body>
</html>
